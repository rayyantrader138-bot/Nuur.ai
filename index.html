<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070816">
<title>Nuur AI Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header>
 <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></div>
 <div><h1>Nuur AI</h1><small id="t_sub"></small></div>
 <div class="sp"></div>
 <button class="ib lang" id="lang" title="Language">اردو</button>
 <button class="ib" id="theme" title="Theme"></button>
 <button class="ib" id="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
 <button class="ib" id="clear" title="Clear"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
</header>
<div class="tabs">
 <button class="tab on" data-p="chat"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.5 7.2L3 21l1.8-6.1A8 8 0 1121 12z"/></svg><span id="t_chat"></span></button>
 <button class="tab" data-p="img"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg><span id="t_img"></span></button>
</div>
<main id="main"><div class="pane on" id="p_chat"></div><div class="pane" id="p_img"></div></main>
<footer>
 <div id="att" class="att" hidden><img id="attimg" alt=""><span id="t_edit"></span><button class="ib" id="attx" title="Remove"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="bar">
  <input type="file" id="file" accept="image/*" hidden>
  <button class="ib" id="pick" title="Add photo"><svg viewBox="0 0 24 24"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 01-7.8-7.8l9-9a3.7 3.7 0 015.2 5.2l-9 9a1.8 1.8 0 01-2.6-2.6l8.5-8.5"/></svg></button>
  <button class="ib mic" id="mic" title="Voice"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg></button>
  <textarea id="in" rows="1"></textarea>
  <button class="ib send" id="send" title="Send"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
 </div>
</footer>
</div>
<div id="modal" class="modal" hidden><div class="sheet">
 <h2 id="m_t"></h2>
 <label id="l_prov"></label><select id="prov"><option value="gemini">Google Gemini (free key)</option><option value="openai">OpenAI</option></select>
 <label id="l_key"></label><input id="key" type="password" autocomplete="off" placeholder="API key">
 <label>Chat model</label><input id="mchat">
 <label>Image model</label><input id="mimg">
 <p id="m_note" class="hint"></p>
 <div class="row"><button class="btn" id="m_cancel"></button><button class="btn pri" id="m_save"></button></div>
</div></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
